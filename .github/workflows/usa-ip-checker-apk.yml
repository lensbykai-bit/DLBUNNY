name: USA IP Checker APK
on:
  push:
    branches:
      - usa-ip-checker-apk-20261015
    paths:
      - "usa-ip-checker/**"
      - ".github/workflows/usa-ip-checker-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        working-directory: usa-ip-checker
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: USA-IP-Checker-APK
          path: usa-ip-checker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
